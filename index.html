<!doctype html>
<html lang="en">

      fetchpriority="high"
    />
    <style>
      html, body { margin: 0; background: #f8fafc; }
      #fcp-shell {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 176px;
        font-family: system-ui, -apple-system, sans-serif;
        background: #f8fafc;
        z-index: 50;
        text-align: center;
      }
      #fcp-shell img {
        width: 160px;
        height: 160px;
        border-radius: 50%;
        object-fit: cover;
        box-shadow: 0 10px 25px rgb(0 0 0 / 0.12);
      }
      #fcp-shell h1 {
        margin: 24px 0 0;
        font-size: 2rem;
        font-weight: 800;
        color: #111827;
      }
      @media (min-width: 768px) {
        #fcp-shell img { width: 208px; height: 208px; }

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="author" content="Nishanth K" />
    <meta property="og:title" content="K.Nishanth's Portfolio | Software Developer" />
    <meta
      property="og:description"
      content="Portfolio of Nishanth K, a software developer skilled in Java, Python, and MERN. Explore FYERS SEO platforms, IoT projects, and contact details."

    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />

      name="twitter:description"
      content="Portfolio of Nishanth K, a software developer skilled in Java, Python, and MERN. Explore FYERS SEO platforms, IoT projects, and contact details."

  </head>

    <div id="fcp-shell">
